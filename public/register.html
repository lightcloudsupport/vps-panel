<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create account - LightCloud</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head><body>
<div id="bg" aria-hidden="true"></div><script src="bg.js"></script>
<div id="login"><form class="card win" id="lf">
  <div class="bar2"><i></i><i></i><i></i><span style="margin-left:8px">lightcloud / register</span></div>
  <div class="in">
    <div class="brand">LightCloud</div><div class="tag">Create your free account</div>
    <input id="e" type="email" placeholder="Email" autocomplete="email" required>
    <input id="u" placeholder="Username" autocomplete="username" required>
    <input id="p" type="password" placeholder="Password (8+ characters)" autocomplete="new-password" required>
    <button class="btn">Create account</button>
    <a class="btn discord" href="/auth/discord">Continue with Discord</a>
    <small>Already registered? <a href="login.html">Sign in</a></small>
    <small id="err" class="error" role="alert"></small>
  </div>
</form></div>
<script>
const $=s=>document.querySelector(s);
if(new URLSearchParams(location.search).get('error')==='discord')$('#err').textContent='Discord sign-in failed. Try again.';
$('#lf').onsubmit=async e=>{
  e.preventDefault();
  const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$("#e").value,username:$("#u").value,password:$("#p").value})});
  const d=await r.json().catch(()=>({}));
  if(r.ok)location.href='/';else $('#err').textContent=d.error||'Something went wrong.';
};
</script></body></html>
